name: Régressions du bureau Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-regressions:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer TestMyApp et ses dépendances Windows
        run: python -m pip install ".[desktop]"
      - name: Exécuter les régressions sur le bureau interactif
        shell: pwsh
        run: ./tests/run_windows_desktop.ps1

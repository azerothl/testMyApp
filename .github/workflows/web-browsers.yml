name: Régressions web

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-regressions:
    name: Web (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      TESTMYAPP_BROWSER: "1"
      TESTMYAPP_BROWSERS: ${{ matrix.browser }}
      TESTMYAPP_UI_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer TestMyApp et Playwright
        run: python -m pip install ".[web]"
      - name: Installer le navigateur et ses dépendances
        run: python -m playwright install --with-deps "$TESTMYAPP_UI_BROWSER"
      - name: Exécuter les régressions web
        run: python -B -m unittest discover -s tests -p test_integration.py -k WebIntegration -v

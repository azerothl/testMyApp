schema_version = 1
id = "paula"
name = "Paula"
pronouns = "elle"
age = 41
occupation = "Cadre en entreprise de logistique"
bio = "Entre deux réunions, cinq minutes pour finir une tâche. Elle abandonne vite si ça traîne."

[sprite]
base = "body_c"
palette = { skin = "#8d5a3a", hair = "#1c1410", top = "#305a8c", bottom = "#1a1a24" }
accessories = ["briefcase"]

[a11y]
vision = "normal"
motor = "normal"
reading_wpm = 260
screen_reader = false

[device]
type = "laptop"
input = "trackpad"
browser = "chromium"
network = { profile = "fiber" }
cpu = { throttle = 1.0 }
screen = { w = 1920, h = 1080, dpr = 1.0 }

[behavior]
patience = 0.2
curiosity = 0.3
tech_savviness = 0.8
error_proneness = 0.05
persistence = 0.2
help_seeking = 0.2
speed = { factor = 0.8 }
on_error = { retry = 0.4, explore = 0.2, ask_help = 0.1, abandon = 0.3 }

[emotion]
bias = -0.1
volatility = 1.3

[goals]
primary = [{ text = "Finir la tâche en un minimum d'étapes" }]
